<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#161616" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Sign in — LookAtMe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body { background-color: #161616; }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.3);
    }
    .input {
      width: 100%;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #2e2e2e;
      border-radius: 0.75rem;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      transition: border-color 0.15s;
      outline: none;
    }
    .input:focus { border-color: #3b82f6; }
    .input::placeholder { color: #4b5563; }
    .btn-primary {
      width: 100%;
      background-color: #3b82f6;
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1rem;
      min-height: 44px;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background-color: #2563eb; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background-color: #1e40af; opacity: 0.6; cursor: not-allowed; }
    .tab {
      flex: 1;
      padding: 0.5rem;
      min-height: 36px;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-align: center;
    }
    .tab-active { background-color: #3b82f6; color: #fff; }
    .tab-inactive { color: #6b7280; }
    .tab-inactive:hover { color: #d1d5db; }
    .error-box {
      background-color: #2d1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 0.625rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.8125rem;
    }
    .success-box {
      background-color: #0f2e1a;
      border: 1px solid #166534;
      color: #86efac;
      border-radius: 0.625rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.8125rem;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #4b5563;
      font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }
    .btn-secondary {
      width: 100%;
      background-color: transparent;
      color: #9ca3af;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.625rem 1rem;
      border-radius: 0.75rem;
      cursor: pointer;
      border: 1px solid #2e2e2e;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: #4b5563; color: #d1d5db; }
  </style>
</head>
<body class="text-white min-h-screen font-sans flex items-center justify-center px-4">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center">
        <span class="text-white font-black text-sm">W</span>
      </div>
      <span class="text-white font-bold text-xl tracking-tight">Write it Down</span>
    </div>

    <!-- Card -->
    <div class="card p-6">

      <!-- Tabs -->
      <div class="flex gap-1 bg-[#161616] rounded-lg p-1 mb-6">
        <button id="tab-login"    class="tab tab-active"   onclick="showTab('login')">Sign in</button>
        <button id="tab-register" class="tab tab-inactive" onclick="showTab('register')">Create account</button>
        <button id="tab-reset"    class="tab tab-inactive" onclick="showTab('reset')">Reset</button>
      </div>

      <!-- Success -->
      <div id="success-box" class="success-box hidden mb-4"></div>

      <!-- Error -->
      <div id="error-box" class="error-box hidden mb-4"></div>

      <!-- Resend verification (shown only after 403) -->
      <div id="resend-box" class="hidden mb-4">
        <button id="btn-resend" class="btn-secondary" onclick="submitResendVerification()">
          Resend verification email
        </button>
      </div>

      <!-- Login form -->
      <form id="form-login" onsubmit="return false" class="space-y-3">
        <input
          id="login-email"
          type="email"
          class="input"
          placeholder="Email address"
          autocomplete="email"
          required
        />
        <input
          id="login-password"
          type="password"
          class="input"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button id="btn-login" class="btn-primary mt-1" onclick="submitLogin()">
          Sign in
        </button>
        <div class="divider">or</div>
        <button id="btn-magic" class="btn-secondary" onclick="submitMagicLogin()">
          Send sign-in link to my email
        </button>
      </form>

      <!-- Register form (hidden by default) -->
      <form id="form-register" onsubmit="return false" class="space-y-3 hidden">
        <input
          id="reg-email"
          type="email"
          class="input"
          placeholder="Email address"
          autocomplete="email"
          required
        />
        <input
          id="reg-password"
          type="password"
          class="input"
          placeholder="Password (min. 8 characters)"
          autocomplete="new-password"
          required
        />
        <input
          id="reg-confirm"
          type="password"
          class="input"
          placeholder="Confirm password"
          autocomplete="new-password"
          required
        />
        <button id="btn-register" class="btn-primary mt-1" onclick="submitRegister()">
          Create account
        </button>
      </form>

      <!-- Reset password form (hidden by default) -->
      <form id="form-reset" onsubmit="return false" class="space-y-3 hidden">
        <input
          id="reset-email"
          type="email"
          class="input"
          placeholder="Email address"
          autocomplete="email"
          required
        />
        <input
          id="reset-password"
          type="password"
          class="input"
          placeholder="New password (min. 8 characters)"
          autocomplete="new-password"
          required
        />
        <input
          id="reset-confirm"
          type="password"
          class="input"
          placeholder="Confirm new password"
          autocomplete="new-password"
          required
        />
        <button id="btn-reset" class="btn-primary mt-1" onclick="submitReset()">
          Reset password
        </button>
        <div class="divider">or</div>
        <button id="btn-request-reset" class="btn-secondary" onclick="submitRequestReset()">
          Send reset link to my email
        </button>
      </form>

      <!-- Token-based new-password form (shown when ?reset_token is in URL) -->
      <form id="form-reset-token" onsubmit="return false" class="space-y-3 hidden">
        <p class="text-[#9ca3af] text-sm">Enter your new password below.</p>
        <input
          id="reset-token-password"
          type="password"
          class="input"
          placeholder="New password (min. 8 characters)"
          autocomplete="new-password"
          required
        />
        <input
          id="reset-token-confirm"
          type="password"
          class="input"
          placeholder="Confirm new password"
          autocomplete="new-password"
          required
        />
        <button id="btn-reset-token" class="btn-primary mt-1" onclick="submitResetWithToken()">
          Set new password
        </button>
      </form>

    </div>

    <p class="text-center text-[#4b5563] text-xs mt-6">
      Your data stays on your device.
    </p>

  </div>

  <script>
    let _resetToken = null;

    // ── Page load ─────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      // Session check — redirect to dashboard if already logged in.
      // Skip when ?reset_token is present so the user can complete their reset.
      if (!new URLSearchParams(window.location.search).has('reset_token')) {
        fetch('/api/auth/me').then(res => {
          if (res.ok) window.location.replace('/');
        }).catch(() => {});
      }

      const params = new URLSearchParams(window.location.search);

      const msg = params.get('msg');
      if (msg === 'verified') {
        showSuccess('Email verified — sign in below.');
      } else if (msg === 'invalid_token') {
        showError('This link is invalid or has already been used.');
      } else if (msg === 'token_expired') {
        showError('This link has expired. Please request a new one.');
      }

      const rt = params.get('reset_token');
      if (rt) {
        _resetToken = rt;
        // Hide all standard tabs/forms and show token-reset form
        ['login', 'register', 'reset'].forEach(t => {
          document.getElementById('form-' + t).classList.add('hidden');
          document.getElementById('tab-' + t).classList.add('hidden');
        });
        document.getElementById('form-reset-token').classList.remove('hidden');
      }

      // Clean the URL without reloading
      if (msg || rt) {
        window.history.replaceState({}, '', window.location.pathname);
      }
    });

    // ── Tab switching ─────────────────────────────────────────────────
    function showTab(tab) {
      ['login', 'register', 'reset'].forEach(t => {
        document.getElementById('form-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).className = 'tab ' + (t === tab ? 'tab-active' : 'tab-inactive');
      });
      hideError();
      hideSuccess();
      hideResend();
    }

    // ── Message display ───────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('error-box');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-box').classList.add('hidden');
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-box');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideSuccess() {
      document.getElementById('success-box').classList.add('hidden');
    }

    let _resendEmail = null;
    function showResend(email) {
      _resendEmail = email;
      document.getElementById('resend-box').classList.remove('hidden');
    }
    function hideResend() {
      _resendEmail = null;
      document.getElementById('resend-box').classList.add('hidden');
      document.getElementById('btn-resend').disabled    = false;
      document.getElementById('btn-resend').textContent = 'Resend verification email';
    }

    // ── Login ─────────────────────────────────────────────────────────
    async function submitLogin() {
      hideError();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = document.getElementById('btn-login');

      if (!email || !password) { showError('Please fill in all fields.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Sign in failed.');
          if (res.status === 403) showResend(email);
          return;
        }
        window.location.href = '/';
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Sign in';
      }
    }

    // ── Register ──────────────────────────────────────────────────────
    async function submitRegister() {
      hideError();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm  = document.getElementById('reg-confirm').value;
      const btn      = document.getElementById('btn-register');

      if (!email || !password || !confirm) { showError('Please fill in all fields.'); return; }
      if (password !== confirm)            { showError('Passwords do not match.');     return; }
      if (password.length < 8)             { showError('Password must be at least 8 characters.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Creating account…';

      try {
        const res  = await fetch('/api/auth/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Registration failed.');
          return;
        }
        showSuccess(data.message || 'Account created.');
        showTab('login');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Create account';
      }
    }

    // ── Reset password ────────────────────────────────────────────────
    async function submitReset() {
      hideError();
      const email       = document.getElementById('reset-email').value.trim();
      const newPassword = document.getElementById('reset-password').value;
      const confirm     = document.getElementById('reset-confirm').value;
      const btn         = document.getElementById('btn-reset');

      if (!email || !newPassword || !confirm) { showError('Please fill in all fields.'); return; }
      if (newPassword !== confirm)             { showError('Passwords do not match.');    return; }
      if (newPassword.length < 8)              { showError('Password must be at least 8 characters.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Resetting…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, new_password: newPassword }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Reset failed.');
          return;
        }
        showTab('login');
        document.getElementById('login-email').value = email;
        showError('Password reset — sign in with your new password.');
        document.getElementById('error-box').style.backgroundColor = '#0f2e1a';
        document.getElementById('error-box').style.borderColor     = '#166534';
        document.getElementById('error-box').style.color           = '#86efac';
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Reset password';
      }
    }

    // ── Resend verification ───────────────────────────────────────────
    async function submitResendVerification() {
      const btn = document.getElementById('btn-resend');
      btn.disabled    = true;
      btn.textContent = 'Sending…';

      try {
        await fetch('/api/auth/resend-verification', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email: _resendEmail }),
        });
        hideResend();
        hideError();
        showSuccess('Verification email sent — check your inbox.');
      } catch {
        btn.disabled    = false;
        btn.textContent = 'Resend verification email';
      }
    }

    // ── Magic login ───────────────────────────────────────────────────
    async function submitMagicLogin() {
      hideError();
      const email = document.getElementById('login-email').value.trim();
      const btn   = document.getElementById('btn-magic');

      if (!email) { showError('Enter your email address first.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Sending…';

      try {
        await fetch('/api/auth/magic-login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        showSuccess('Check your inbox — a sign-in link is on its way.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Send sign-in link to my email';
      }
    }

    // ── Request reset email ───────────────────────────────────────────
    async function submitRequestReset() {
      hideError();
      const email = document.getElementById('reset-email').value.trim();
      const btn   = document.getElementById('btn-request-reset');

      if (!email) { showError('Enter your email address first.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Sending…';

      try {
        await fetch('/api/auth/request-reset', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        showSuccess('If an account exists for that email, a reset link has been sent.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Send reset link to my email';
      }
    }

    // ── Token-based password reset ────────────────────────────────────
    async function submitResetWithToken() {
      hideError();
      const newPassword = document.getElementById('reset-token-password').value;
      const confirm     = document.getElementById('reset-token-confirm').value;
      const btn         = document.getElementById('btn-reset-token');

      if (!newPassword || !confirm) { showError('Please fill in all fields.'); return; }
      if (newPassword !== confirm)  { showError('Passwords do not match.');     return; }
      if (newPassword.length < 8)   { showError('Password must be at least 8 characters.'); return; }

      btn.disabled    = true;
      btn.textContent = 'Saving…';

      try {
        const res  = await fetch('/api/auth/reset-with-token', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token: _resetToken, new_password: newPassword }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Reset failed.');
          return;
        }
        // Show login form with success message
        document.getElementById('form-reset-token').classList.add('hidden');
        ['login', 'register', 'reset'].forEach(t => {
          document.getElementById('tab-' + t).classList.remove('hidden');
        });
        showTab('login');
        showSuccess('Password updated — sign in with your new password.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Set new password';
      }
    }

    // ── Enter key submits the active form ─────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (!document.getElementById('form-reset-token').classList.contains('hidden')) submitResetWithToken();
      else if (!document.getElementById('form-login').classList.contains('hidden'))  submitLogin();
      else if (!document.getElementById('form-register').classList.contains('hidden')) submitRegister();
      else submitReset();
    });
  </script>

</body>
</html>
