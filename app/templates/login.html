<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Sign in — LookAtMe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    html[data-theme="dark"] {
      --bg-main: #111111;
      --bg-card: #1e1e1e;
      --bg-card-soft: #242424;
      --bg-hover: #252525;
      --bg-active: #2a2a2a;
      --bg-input: #181818;
      --text-primary: #f0f0f0;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --border: rgba(255,255,255,0.07);
      --border-subtle: rgba(255,255,255,0.05);
      --accent: #a3e635;
      --accent-hover: #84cc16;
      --accent-ink: #111827;
      --accent-glow: rgba(163,230,53,0.22);
      --danger-bg: #2d1515;
      --danger-border: #7f1d1d;
      --danger-text: #fca5a5;
      --success-bg: #0f2e1a;
      --success-border: #166534;
      --success-text: #86efac;
      --blob-a: rgba(163,230,53,0.16);
      --blob-b: rgba(59,130,246,0.14);
      --blob-c: rgba(234,88,12,0.12);
      --theme-color: #111111;
    }
    html[data-theme="light"] {
      --bg-main: #f5f5f7;
      --bg-card: #ffffff;
      --bg-card-soft: #f8f8fa;
      --bg-hover: #f0f0f2;
      --bg-active: #e8e8ea;
      --bg-input: #f3f4f6;
      --text-primary: #1c1c1e;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border: rgba(0,0,0,0.08);
      --border-subtle: rgba(0,0,0,0.06);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-ink: #ffffff;
      --accent-glow: rgba(37,99,235,0.18);
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;
      --success-bg: #ecfdf3;
      --success-border: #86efac;
      --success-text: #166534;
      --blob-a: rgba(37,99,235,0.15);
      --blob-b: rgba(163,230,53,0.14);
      --blob-c: rgba(14,165,233,0.12);
      --theme-color: #f5f5f7;
    }
    html[data-theme="sepia"] {
      --bg-main: #f4ecd8;
      --bg-card: #fbf6e7;
      --bg-card-soft: #f2e9d2;
      --bg-hover: #ece1c9;
      --bg-active: #e0d3b8;
      --bg-input: #efe5cf;
      --text-primary: #3c2a1a;
      --text-secondary: #6b5040;
      --text-muted: #8a7060;
      --border: rgba(91,70,54,0.17);
      --border-subtle: rgba(91,70,54,0.1);
      --accent: #b45309;
      --accent-hover: #92400e;
      --accent-ink: #fffaf0;
      --accent-glow: rgba(180,83,9,0.2);
      --danger-bg: #fff1eb;
      --danger-border: #fdbba7;
      --danger-text: #9a3412;
      --success-bg: #edf7ea;
      --success-border: #86efac;
      --success-text: #166534;
      --blob-a: rgba(180,83,9,0.16);
      --blob-b: rgba(120,53,15,0.12);
      --blob-c: rgba(132,204,22,0.1);
      --theme-color: #f4ecd8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    .auth-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      filter: blur(48px);
      border-radius: 9999px;
      opacity: 0.9;
      animation: drift 14s ease-in-out infinite;
    }
    .blob.a { width: 22rem; height: 22rem; background: var(--blob-a); top: -4rem; left: -3rem; }
    .blob.b { width: 18rem; height: 18rem; background: var(--blob-b); right: -2rem; top: 20%; animation-delay: -5s; }
    .blob.c { width: 20rem; height: 20rem; background: var(--blob-c); left: 35%; bottom: -8rem; animation-delay: -9s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(12px, -14px) scale(1.05); }
    }

    .auth-shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-wrap {
      width: 100%;
      max-width: 26rem;
      animation: cardIn 0.55s cubic-bezier(0.16,1,0.3,1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .theme-switch {
      display: inline-flex;
      gap: 0.3rem;
      background: var(--bg-card-soft);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0.22rem;
      margin-bottom: 1rem;
    }
    .theme-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.72rem;
      line-height: 1;
      font-weight: 700;
      padding: 0.42rem 0.62rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .theme-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }
    .brand-mark {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 0.95rem;
      background: linear-gradient(140deg, var(--bg-card-soft), var(--bg-hover));
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 1rem;
      border: 1px solid var(--accent-glow);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .brand-mark img { width: 1.35rem; height: 1.35rem; }
    .brand-name {
      font-size: 1.26rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-name span { color: var(--accent); }

    .card {
      background: color-mix(in srgb, var(--bg-card) 88%, transparent);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: 0 8px 34px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      padding: 1.25rem;
    }

    .tabs {
      display: flex;
      gap: 0.3rem;
      background: var(--bg-card-soft);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 0.28rem;
      margin-bottom: 1rem;
    }
    .tab {
      flex: 1;
      border: 0;
      border-radius: 0.56rem;
      padding: 0.48rem;
      min-height: 2.2rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.16s ease, color 0.16s ease;
    }
    .tab:active { transform: scale(0.98); }
    .tab-active {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent) inset;
    }
    .tab-inactive {
      background: transparent;
      color: var(--text-muted);
    }
    .tab-inactive:hover { color: var(--text-secondary); background: var(--bg-hover); }

    .input {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 0.72rem;
      padding: 0.66rem 0.92rem;
      font-size: 0.9rem;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      outline: none;
    }
    .input:focus {
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
      background: var(--bg-hover);
    }
    .input::placeholder { color: var(--text-muted); }

    .btn-primary, .btn-secondary {
      width: 100%;
      min-height: 2.7rem;
      border-radius: 0.72rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary {
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 6px 18px var(--accent-glow);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.62; cursor: not-allowed; box-shadow: none; }

    .btn-secondary {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: color-mix(in srgb, var(--accent) 22%, var(--border));
      color: var(--text-primary);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-muted);
      font-size: 0.72rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .error-box, .success-box {
      border-radius: 0.68rem;
      padding: 0.62rem 0.85rem;
      font-size: 0.82rem;
      border: 1px solid;
    }
    .error-box {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }
    .success-box {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .auth-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.76rem;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .card { padding: 1rem; }
      .brand-name { font-size: 1.12rem; }
      .tabs { gap: 0.2rem; }
      .tab { font-size: 0.75rem; padding: 0.45rem 0.28rem; }
    }
  </style>
</head>
<body>
  <div class="auth-bg" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
  </div>

  <main class="auth-shell">
    <div class="auth-wrap">
      <div style="display:flex;justify-content:center;">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button class="theme-btn" data-theme-btn="dark" type="button" onclick="setTheme('dark')">Dark</button>
          <button class="theme-btn" data-theme-btn="light" type="button" onclick="setTheme('light')">Light</button>
          <button class="theme-btn" data-theme-btn="sepia" type="button" onclick="setTheme('sepia')">Sepia</button>
        </div>
      </div>

      <div class="brand">
        <div class="brand-mark"><img src="/logo.svg" alt="LookAtMe" /></div>
        <div class="brand-name">Look<span>At</span>Me</div>
      </div>

      <section class="card">
        <div class="tabs">
          <button id="tab-login" class="tab tab-active" onclick="showTab('login')">Sign in</button>
          <button id="tab-register" class="tab tab-inactive" onclick="showTab('register')">Create</button>
          <button id="tab-reset" class="tab tab-inactive" onclick="showTab('reset')">Reset</button>
        </div>

        <div id="success-box" class="success-box hidden mb-4"></div>
        <div id="error-box" class="error-box hidden mb-4"></div>

        <div id="resend-box" class="hidden mb-4">
          <button id="btn-resend" class="btn-secondary" onclick="submitResendVerification()">Resend verification email</button>
        </div>

        <form id="form-login" onsubmit="return false" class="space-y-3">
          <input id="login-email" type="email" class="input" placeholder="Email address" autocomplete="email" required />
          <input id="login-password" type="password" class="input" placeholder="Password" autocomplete="current-password" required />
          <button id="btn-login" class="btn-primary mt-1" onclick="submitLogin()">Sign in</button>
          <div class="divider">or</div>
          <button id="btn-magic" class="btn-secondary" onclick="submitMagicLogin()">Send sign-in link to my email</button>
        </form>

        <form id="form-register" onsubmit="return false" class="space-y-3 hidden">
          <input id="reg-email" type="email" class="input" placeholder="Email address" autocomplete="email" required />
          <input id="reg-password" type="password" class="input" placeholder="Password (min. 8 characters)" autocomplete="new-password" required />
          <input id="reg-confirm" type="password" class="input" placeholder="Confirm password" autocomplete="new-password" required />
          <button id="btn-register" class="btn-primary mt-1" onclick="submitRegister()">Create account</button>
        </form>

        <form id="form-reset" onsubmit="return false" class="space-y-3 hidden">
          <input id="reset-email" type="email" class="input" placeholder="Email address" autocomplete="email" required />
          <input id="reset-password" type="password" class="input" placeholder="New password (min. 8 characters)" autocomplete="new-password" required />
          <input id="reset-confirm" type="password" class="input" placeholder="Confirm new password" autocomplete="new-password" required />
          <button id="btn-reset" class="btn-primary mt-1" onclick="submitReset()">Reset password</button>
          <div class="divider">or</div>
          <button id="btn-request-reset" class="btn-secondary" onclick="submitRequestReset()">Send reset link to my email</button>
        </form>

        <form id="form-reset-token" onsubmit="return false" class="space-y-3 hidden">
          <p class="text-sm" style="color:var(--text-secondary);">Enter your new password below.</p>
          <input id="reset-token-password" type="password" class="input" placeholder="New password (min. 8 characters)" autocomplete="new-password" required />
          <input id="reset-token-confirm" type="password" class="input" placeholder="Confirm new password" autocomplete="new-password" required />
          <button id="btn-reset-token" class="btn-primary mt-1" onclick="submitResetWithToken()">Set new password</button>
        </form>
      </section>

      <p class="auth-note">Secure sign-in. Your data stays private.</p>
    </div>
  </main>

  <script>
    let _resetToken = null;

    function setTheme(theme) {
      const root = document.documentElement;
      root.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      syncThemeUi();
    }

    function syncThemeUi() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        const color = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim() || '#111111';
        meta.setAttribute('content', color);
      }
      document.querySelectorAll('[data-theme-btn]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-theme-btn') === current);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      syncThemeUi();

      if (!new URLSearchParams(window.location.search).has('reset_token')) {
        fetch('/api/auth/me').then(res => {
          if (res.ok) window.location.replace('/');
        }).catch(() => {});
      }

      const params = new URLSearchParams(window.location.search);

      const msg = params.get('msg');
      if (msg === 'verified') {
        showSuccess('Email verified, sign in below.');
      } else if (msg === 'invalid_token') {
        showError('This link is invalid or has already been used.');
      } else if (msg === 'token_expired') {
        showError('This link has expired. Please request a new one.');
      }

      const rt = params.get('reset_token');
      if (rt) {
        _resetToken = rt;
        ['login', 'register', 'reset'].forEach(t => {
          document.getElementById('form-' + t).classList.add('hidden');
          document.getElementById('tab-' + t).classList.add('hidden');
        });
        document.getElementById('form-reset-token').classList.remove('hidden');
      }

      if (msg || rt) {
        window.history.replaceState({}, '', window.location.pathname);
      }
    });

    function showTab(tab) {
      ['login', 'register', 'reset'].forEach(t => {
        document.getElementById('form-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).className = 'tab ' + (t === tab ? 'tab-active' : 'tab-inactive');
      });
      hideError();
      hideSuccess();
      hideResend();
    }

    function showError(msg) {
      const el = document.getElementById('error-box');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-box').classList.add('hidden');
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-box');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideSuccess() {
      document.getElementById('success-box').classList.add('hidden');
    }

    let _resendEmail = null;
    function showResend(email) {
      _resendEmail = email;
      document.getElementById('resend-box').classList.remove('hidden');
    }
    function hideResend() {
      _resendEmail = null;
      document.getElementById('resend-box').classList.add('hidden');
      document.getElementById('btn-resend').disabled = false;
      document.getElementById('btn-resend').textContent = 'Resend verification email';
    }

    async function submitLogin() {
      hideError();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      if (!email || !password) { showError('Please fill in all fields.'); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Sign in failed.');
          if (res.status === 403) showResend(email);
          return;
        }
        window.location.href = '/';
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    async function submitRegister() {
      hideError();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const btn = document.getElementById('btn-register');

      if (!email || !password || !confirm) { showError('Please fill in all fields.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const _urlP = new URLSearchParams(window.location.search);
      const _next = _urlP.get('next') || '';
      const _iMatch = _next.match(/^\/invite\/([A-Za-z0-9_-]+)$/);
      const _inviteToken = _iMatch ? _iMatch[1] : '';

      try {
        const body = { email, password };
        if (_inviteToken) body.invite_token = _inviteToken;
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Registration failed.');
          return;
        }
        showSuccess(data.message || 'Account created.');
        showTab('login');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }

    async function submitReset() {
      hideError();
      const email = document.getElementById('reset-email').value.trim();
      const newPassword = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-confirm').value;
      const btn = document.getElementById('btn-reset');

      if (!email || !newPassword || !confirm) { showError('Please fill in all fields.'); return; }
      if (newPassword !== confirm) { showError('Passwords do not match.'); return; }
      if (newPassword.length < 8) { showError('Password must be at least 8 characters.'); return; }

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, new_password: newPassword }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Reset failed.');
          return;
        }
        showTab('login');
        document.getElementById('login-email').value = email;
        showSuccess('Password reset, sign in with your new password.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    }

    async function submitResendVerification() {
      const btn = document.getElementById('btn-resend');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: _resendEmail }),
        });
        hideResend();
        hideError();
        showSuccess('Verification email sent, check your inbox.');
      } catch {
        btn.disabled = false;
        btn.textContent = 'Resend verification email';
      }
    }

    async function submitMagicLogin() {
      hideError();
      const email = document.getElementById('login-email').value.trim();
      const btn = document.getElementById('btn-magic');

      if (!email) { showError('Enter your email address first.'); return; }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await fetch('/api/auth/magic-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        showSuccess('Check your inbox, a sign-in link is on its way.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send sign-in link to my email';
      }
    }

    async function submitRequestReset() {
      hideError();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('btn-request-reset');

      if (!email) { showError('Enter your email address first.'); return; }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await fetch('/api/auth/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        showSuccess('If an account exists for that email, a reset link has been sent.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send reset link to my email';
      }
    }

    async function submitResetWithToken() {
      hideError();
      const newPassword = document.getElementById('reset-token-password').value;
      const confirm = document.getElementById('reset-token-confirm').value;
      const btn = document.getElementById('btn-reset-token');

      if (!newPassword || !confirm) { showError('Please fill in all fields.'); return; }
      if (newPassword !== confirm) { showError('Passwords do not match.'); return; }
      if (newPassword.length < 8) { showError('Password must be at least 8 characters.'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const res = await fetch('/api/auth/reset-with-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: _resetToken, new_password: newPassword }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Reset failed.');
          return;
        }
        document.getElementById('form-reset-token').classList.add('hidden');
        ['login', 'register', 'reset'].forEach(t => {
          document.getElementById('tab-' + t).classList.remove('hidden');
        });
        showTab('login');
        showSuccess('Password updated, sign in with your new password.');
      } catch {
        showError('Could not connect to the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (!document.getElementById('form-reset-token').classList.contains('hidden')) submitResetWithToken();
      else if (!document.getElementById('form-login').classList.contains('hidden')) submitLogin();
      else if (!document.getElementById('form-register').classList.contains('hidden')) submitRegister();
      else submitReset();
    });
  </script>
</body>
</html>
