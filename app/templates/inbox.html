<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>LookAtMe — Inbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body { background-color: #161616; }
    .sidebar { background-color: #111111; border-right: 1px solid #2a2a2a; }
    .nav-link { color: #8a8a8a; transition: background 0.15s, color 0.15s; }
    .nav-link:hover { background-color: #1e1e1e; color: #ffffff; }
    .nav-link.active { background-color: #1e1e1e; color: #ffffff; border-left: 2px solid #3b82f6; }
    .card { background-color: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.4); overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem 0.875rem; border-bottom: 1px solid #252525; }
    .card-title { font-size: 0.7rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; }
    .msg-row { border-bottom: 1px solid #222; transition: background 0.12s; cursor: pointer; }
    .msg-row:hover { background-color: #252525; }
    .msg-row.unread { background-color: #1a2236; }
    .msg-row.unread:hover { background-color: #1e2a42; }
    .field-input { background-color: #1a1a1a; border: 1px solid #333; color: #e5e7eb; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; width: 100%; transition: border-color 0.15s; }
    .field-input:focus { outline: none; border-color: #3b82f6; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* Modal */
    #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex; align-items: center; justify-content: center; }
    #modal-backdrop.hidden { display: none; }
    #modal-box { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 1rem; width: 100%; max-width: 540px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }

    /* Compose panel */
    #compose-panel { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 380px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 1rem; box-shadow: 0 8px 40px rgba(0,0,0,0.6); z-index: 40; }
    #compose-panel.hidden { display: none; }

    /* Toast */
    #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 0.55rem 1.2rem; border-radius: 0.5rem; font-size: 0.82rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.error { background: #dc2626; }
    #toast.show { opacity: 1; }

    /* ── Mobile responsive ── */
    .mobile-header {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: #111111; border-bottom: 1px solid #2a2a2a;
      align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 50;
    }
    .mobile-hamburger {
      display: flex; flex-direction: column; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 8px; margin: -8px;
    }
    .mobile-hamburger span { display: block; width: 20px; height: 2px; background: #8a8a8a; border-radius: 2px; }
    .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 15; display: none; }
    @media (max-width: 767px) {
      .mobile-header { display: flex; }
      .sidebar { transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); z-index: 20; }
      .sidebar.open { transform: translateX(0); }
      #inbox-main { margin-left: 0 !important; padding: 64px 12px 24px !important; }
      #compose-panel { left: 0; right: 0; bottom: 0; width: auto; border-radius: 1rem 1rem 0 0; }
      #modal-box { margin: 12px; max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body class="text-white min-h-screen font-sans flex">

  <!-- Mobile overlay + header -->
  <div id="nav-overlay" class="nav-overlay" onclick="closeMobileNav()"></div>
  <header class="mobile-header">
    <button class="mobile-hamburger" onclick="toggleMobileNav()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span style="font-size:14px;font-weight:700;color:#f4f4f5;letter-spacing:-0.01em;">Look<strong>At</strong><span style="color:#a3e635;">Me</span></span>
    <div style="width:36px;"></div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="sidebar fixed top-0 left-0 h-full w-56 flex flex-col z-10 select-none">
    <div class="px-5 py-5 border-b border-[#2a2a2a]">
      <div class="flex items-center gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" style="flex-shrink:0;">
          <rect width="28" height="28" rx="7" fill="#1a1a1a"/>
          <circle cx="14" cy="14" r="11" fill="none" stroke="#a3e635" stroke-width="1.5" opacity="0.3"/>
          <circle cx="14" cy="14" r="7" fill="none" stroke="#a3e635" stroke-width="0.75" opacity="0.18"/>
          <circle cx="14" cy="14" r="4" fill="#a3e635"/>
        </svg>
        <span class="text-white font-bold text-base tracking-tight">Look<strong>At</strong><span style="color:#a3e635;">Me</span></span>
      </div>
      <p id="sidebar-date" class="text-[#5a5a5a] text-xs mt-2"></p>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      <a href="/" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/focus" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Focus Mode
      </a>
      <a href="/learning" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        Learning
      </a>
      <a href="/inbox" class="nav-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <span class="relative flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span id="inbox-badge" class="hidden absolute -top-1.5 -right-1.5 w-3.5 h-3.5 rounded-full bg-blue-500 text-white text-[8px] font-bold flex items-center justify-center leading-none"></span>
        </span>
        Inbox
      </a>
    </nav>

    <div class="px-5 py-4 border-t border-[#2a2a2a] space-y-3">
      <div class="font-mono text-xl font-bold text-white tabular-nums" id="sidebar-clock"></div>
      <p id="sidebar-user" class="text-[#5a5a5a] text-xs truncate"></p>
      <button
        onclick="logout()"
        class="w-full text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer"
        style="background-color:#2a2a2a;color:#9ca3af;"
        onmouseover="this.style.backgroundColor='#3a3a3a';this.style.color='#fff'"
        onmouseout="this.style.backgroundColor='#2a2a2a';this.style.color='#9ca3af'"
      >Sign out</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="inbox-main" class="ml-56 flex-1 p-8 min-h-screen overflow-y-auto">
    <div class="max-w-3xl mx-auto">

      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-white">Inbox</h1>
          <p class="text-[#6b7280] text-sm mt-1">Your messages</p>
        </div>
        <button onclick="openCompose()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          Compose
        </button>
      </div>

      <!-- Tab bar -->
      <div class="flex gap-1 mb-4 border-b border-[#2a2a2a]">
        <button id="tab-inbox" onclick="switchTab('inbox')"
          class="px-4 py-2 text-sm font-semibold text-white border-b-2 border-blue-500 -mb-px transition-colors cursor-pointer">
          Inbox
        </button>
        <button id="tab-sent" onclick="switchTab('sent')"
          class="px-4 py-2 text-sm font-semibold text-[#6b7280] border-b-2 border-transparent -mb-px transition-colors cursor-pointer hover:text-white">
          Sent
        </button>
      </div>

      <!-- Message list -->
      <div class="card">
        <div id="msg-list" class="divide-y divide-[#222] min-h-[200px]">
          <div class="px-5 py-8 text-center text-[#4b5563] text-sm">Loading…</div>
        </div>
      </div>

    </div>
  </main>

  <!-- ── Message detail modal ── -->
  <div id="modal-backdrop" class="hidden" onclick="closeModal(event)">
    <div id="modal-box" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 py-4 border-b border-[#2a2a2a]">
        <h2 id="modal-subject" class="text-white font-semibold text-base"></h2>
        <button onclick="closeModal()" class="text-[#6b7280] hover:text-white transition-colors cursor-pointer text-lg leading-none">✕</button>
      </div>
      <div class="px-5 py-4 border-b border-[#222]">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[#9ca3af] text-xs"><span class="text-[#6b7280]">From:</span> <span id="modal-from"></span></p>
            <p class="text-[#9ca3af] text-xs mt-0.5"><span class="text-[#6b7280]">To:</span> <span id="modal-to"></span></p>
          </div>
          <p id="modal-date" class="text-[#4b5563] text-xs"></p>
        </div>
      </div>
      <div class="px-5 py-5">
        <p id="modal-content" class="text-[#d1d5db] text-sm leading-relaxed whitespace-pre-wrap"></p>
      </div>
      <div class="px-5 pb-5 flex justify-end">
        <button onclick="closeModal()" class="px-4 py-1.5 rounded-lg bg-[#2a2a2a] hover:bg-[#3a3a3a] text-[#9ca3af] hover:text-white text-xs font-semibold transition-colors cursor-pointer">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Compose panel ── -->
  <div id="compose-panel" class="hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-[#2a2a2a]">
      <p class="text-white text-sm font-semibold">New Message</p>
      <button onclick="closeCompose()" class="text-[#6b7280] hover:text-white cursor-pointer leading-none">✕</button>
    </div>
    <div class="px-4 py-4 space-y-3">
      <div>
        <label class="text-[#6b7280] text-xs font-semibold uppercase tracking-wide block mb-1">To</label>
        <select id="compose-to" class="field-input">
          <option value="">Select recipient…</option>
        </select>
      </div>
      <div>
        <label class="text-[#6b7280] text-xs font-semibold uppercase tracking-wide block mb-1">Subject</label>
        <input id="compose-subject" type="text" placeholder="Subject" class="field-input" />
      </div>
      <div>
        <label class="text-[#6b7280] text-xs font-semibold uppercase tracking-wide block mb-1">Message</label>
        <textarea id="compose-body" rows="5" placeholder="Write your message…" class="field-input" style="resize:vertical;"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeCompose()" class="px-3 py-1.5 rounded-lg bg-[#2a2a2a] hover:bg-[#3a3a3a] text-[#9ca3af] text-xs font-semibold cursor-pointer transition-colors">Cancel</button>
        <button onclick="sendMessage()" class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold cursor-pointer transition-colors">Send</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let currentTab = 'inbox';
    let allUsers = [];     // { id, email, display_name }
    let meId = null;

    // ── Helpers ──────────────────────────────────────────────────────────
    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      return sameDay
        ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function userName(id) {
      const u = allUsers.find(u => u.id === id);
      return u ? (u.display_name || u.email) : `User #${id}`;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = isError ? 'error show' : 'show';
      setTimeout(() => { t.className = isError ? 'error' : ''; }, 2500);
    }

    // ── Auth + sidebar ───────────────────────────────────────────────────
    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
      window.location.href = '/login';
    }

    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.status === 401) { window.location.href = '/login'; return; }
        const user = await res.json();
        meId = user.id;
        document.getElementById('sidebar-user').textContent = user.email;
      } catch {}
    })();

    function tick() {
      const now = new Date();
      const cl = document.getElementById('sidebar-clock');
      if (cl) cl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sd = document.getElementById('sidebar-date');
      if (sd && !sd.textContent) sd.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    tick(); setInterval(tick, 1000);

    // ── Unread badge ─────────────────────────────────────────────────────
    async function pollUnread() {
      try {
        const { count } = await fetch('/api/messages/unread-count').then(r => r.json());
        const badge = document.getElementById('inbox-badge');
        if (count > 0) {
          badge.textContent = count > 9 ? '9+' : count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      } catch {}
    }
    pollUnread(); setInterval(pollUnread, 30_000);

    // ── Load users for compose ───────────────────────────────────────────
    async function loadUsers() {
      try {
        allUsers = await fetch('/api/messages/users').then(r => r.json());
        // also include self so userName() works for sent messages
        const selfRes = await fetch('/api/auth/me');
        if (selfRes.ok) {
          const me = await selfRes.json();
          if (!allUsers.find(u => u.id === me.id)) {
            allUsers.push({ id: me.id, email: me.email, display_name: me.display_name || '' });
          }
        }
        const sel = document.getElementById('compose-to');
        sel.innerHTML = '<option value="">Select recipient…</option>';
        allUsers.filter(u => u.id !== meId).forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = u.display_name ? `${u.display_name} (${u.email})` : u.email;
          sel.appendChild(opt);
        });
      } catch {}
    }
    loadUsers();

    // ── Tab switching ────────────────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-inbox').className =
        tab === 'inbox'
          ? 'px-4 py-2 text-sm font-semibold text-white border-b-2 border-blue-500 -mb-px transition-colors cursor-pointer'
          : 'px-4 py-2 text-sm font-semibold text-[#6b7280] border-b-2 border-transparent -mb-px transition-colors cursor-pointer hover:text-white';
      document.getElementById('tab-sent').className =
        tab === 'sent'
          ? 'px-4 py-2 text-sm font-semibold text-white border-b-2 border-blue-500 -mb-px transition-colors cursor-pointer'
          : 'px-4 py-2 text-sm font-semibold text-[#6b7280] border-b-2 border-transparent -mb-px transition-colors cursor-pointer hover:text-white';
      loadMessages();
    }

    // ── Message list ─────────────────────────────────────────────────────
    async function loadMessages() {
      const list = document.getElementById('msg-list');
      list.innerHTML = '<div class="px-5 py-8 text-center text-[#4b5563] text-sm">Loading…</div>';
      try {
        const url = currentTab === 'inbox' ? '/api/messages/inbox' : '/api/messages/sent';
        const msgs = await fetch(url).then(r => r.json());
        if (!msgs.length) {
          const inboxEmpty = `<div style="padding:40px 20px;text-align:center;">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#333;margin:0 auto 12px;display:block;" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <p style="color:#6b7280;font-size:13px;font-weight:500;margin-bottom:4px;">Your inbox is empty</p>
            <p style="color:#4b5563;font-size:12px;">Messages from teammates will appear here.</p>
          </div>`;
          const sentEmpty = `<div style="padding:40px 20px;text-align:center;">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#333;margin:0 auto 12px;display:block;" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <p style="color:#6b7280;font-size:13px;font-weight:500;margin-bottom:4px;">Nothing sent yet</p>
            <p style="color:#4b5563;font-size:12px;">Start a conversation with someone on the team.</p>
          </div>`;
          list.innerHTML = currentTab === 'inbox' ? inboxEmpty : sentEmpty;
          return;
        }
        list.innerHTML = msgs.map(m => renderRow(m)).join('');
      } catch {
        list.innerHTML = '<div class="px-5 py-8 text-center text-[#4b5563] text-sm">Error loading messages.</div>';
      }
    }

    function renderRow(m) {
      const isInbox = currentTab === 'inbox';
      const unread = isInbox && !m.read;
      const counterparty = isInbox ? userName(m.sender_id) : userName(m.recipient_id);
      const label = isInbox ? '' : `<span class="text-[#4b5563] text-xs">To:</span> `;
      const preview = m.content.length > 80 ? m.content.slice(0, 80) + '…' : m.content;

      return `
        <div class="msg-row px-5 py-3.5 ${unread ? 'unread' : ''}" onclick="openMessage(${m.id})">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-2 min-w-0">
              ${unread ? '<span class="flex-shrink-0 w-2 h-2 rounded-full bg-blue-400 mt-1"></span>' : '<span class="flex-shrink-0 w-2 h-2 mt-1"></span>'}
              <div class="min-w-0">
                <div class="flex items-baseline gap-2">
                  <span class="text-sm font-${unread ? 'bold' : 'medium'} text-${unread ? 'white' : '[#d1d5db]'} truncate">${label}${esc(counterparty)}</span>
                  <span class="flex-shrink-0 text-xs text-[#4b5563]">${fmtDate(m.created_at)}</span>
                </div>
                <p class="text-sm ${unread ? 'text-[#e5e7eb] font-medium' : 'text-[#9ca3af]'} truncate">${esc(m.subject)}</p>
                <p class="text-xs text-[#4b5563] truncate mt-0.5">${esc(preview)}</p>
              </div>
            </div>
          </div>
        </div>`;
    }
    loadMessages();

    // ── Open message modal ───────────────────────────────────────────────
    let openMsgData = null;

    async function openMessage(id) {
      // Find in cached list (or re-fetch)
      const url = currentTab === 'inbox' ? '/api/messages/inbox' : '/api/messages/sent';
      let msgs;
      try { msgs = await fetch(url).then(r => r.json()); } catch { return; }
      const m = msgs.find(x => x.id === id);
      if (!m) return;
      openMsgData = m;

      document.getElementById('modal-subject').textContent = m.subject;
      document.getElementById('modal-from').textContent    = userName(m.sender_id);
      document.getElementById('modal-to').textContent      = userName(m.recipient_id);
      document.getElementById('modal-date').textContent    = new Date(m.created_at).toLocaleString();
      document.getElementById('modal-content').textContent = m.content;
      document.getElementById('modal-backdrop').classList.remove('hidden');

      // Mark as read if inbox and unread
      if (currentTab === 'inbox' && !m.read) {
        try {
          await fetch(`/api/messages/${id}/read`, { method: 'PATCH' });
          loadMessages();
          pollUnread();
        } catch {}
      }
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal-backdrop')) return;
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // ── Compose ──────────────────────────────────────────────────────────
    function openCompose() {
      document.getElementById('compose-panel').classList.remove('hidden');
      document.getElementById('compose-subject').focus();
    }

    function closeCompose() {
      document.getElementById('compose-panel').classList.add('hidden');
      document.getElementById('compose-to').value = '';
      document.getElementById('compose-subject').value = '';
      document.getElementById('compose-body').value = '';
    }

    async function sendMessage() {
      const recipient_id = parseInt(document.getElementById('compose-to').value);
      const subject = document.getElementById('compose-subject').value.trim();
      const content = document.getElementById('compose-body').value.trim();

      if (!recipient_id || !subject || !content) {
        showToast('Please fill in all fields', true);
        return;
      }

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient_id, subject, content }),
        });
        if (!res.ok) {
          const err = await res.json();
          showToast(err.error || 'Failed to send', true);
          return;
        }
        showToast('Message sent');
        closeCompose();
        if (currentTab === 'sent') loadMessages();
      } catch {
        showToast('Failed to send', true);
      }
    }

    // ── Mobile nav ───────────────────────────────────────────────────────
    function toggleMobileNav() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('nav-overlay');
      const isOpen  = sidebar.classList.toggle('open');
      overlay.style.display = isOpen ? 'block' : 'none';
    }
    function closeMobileNav() {
      document.querySelector('.sidebar').classList.remove('open');
      document.getElementById('nav-overlay').style.display = 'none';
    }

    // ── Socket.IO — live inbox updates ───────────────────────────────────
    (function () {
      const socket = io({ transports: ['websocket', 'polling'] });

      socket.on('new_message', () => {
        // Reload inbox and badge if we're on the inbox tab
        pollUnread();
        if (currentTab === 'inbox') loadMessages();
      });
    })();
  </script>
</body>
</html>
