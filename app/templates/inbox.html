<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);window.__savedTheme=t;})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>{{ _('LookAtMe — Inbox') }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    html[data-theme="dark"]  { --bg:#161616; --sidebar:#111111; --card:#1e1e1e; --panel:#151515; --hover:#252525; --active:#1e1e1e; --border:#2a2a2a; --text:#ffffff; --muted:#8a8a8a; --soft:#6b7280; --input:#1a1a1a; --input-border:#333; --input-text:#e5e7eb; --accent:#a3e635; --accent-soft:#1f2a14; --accent-soft-hover:#28361a; --brand-bg:#1a1a1a; --success:#16a34a; --danger:#dc2626; }
    html[data-theme="light"] { --bg:#f5f5f7; --sidebar:#ffffff; --card:#ffffff; --panel:#f9fafb; --hover:#f3f4f6; --active:#eef2ff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --soft:#6b7280; --input:#f9fafb; --input-border:#d1d5db; --input-text:#111827; --accent:#2563eb; --accent-soft:#eaf1ff; --accent-soft-hover:#dbe7ff; --brand-bg:#f3f4f6; --success:#16a34a; --danger:#dc2626; }
    html[data-theme="sepia"] { --bg:#f4ecd8; --sidebar:#ede4cf; --card:#fbf6e7; --panel:#f0e8d4; --hover:#eadfca; --active:#eadfca; --border:#d4c3a8; --text:#3c2a1a; --muted:#7c6350; --soft:#8a7060; --input:#f0e8d4; --input-border:#c8b697; --input-text:#3c2a1a; --accent:#b45309; --accent-soft:#efe3cf; --accent-soft-hover:#e6d8c0; --brand-bg:#e6d8c0; --success:#15803d; --danger:#b91c1c; }

    body { background-color: var(--bg); color: var(--text); transition: background-color .2s, color .2s; }
    .sidebar { background-color: var(--sidebar); border-right: 1px solid var(--border); }
    .nav-link { color: var(--muted); transition: background 0.15s, color 0.15s; }
    .nav-link:hover { background-color: var(--hover); color: var(--text); }
    .nav-link.active { background-color: var(--active); color: var(--text); border-left: 2px solid var(--accent); }

    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.22); overflow: hidden; }
    .text-main { color: var(--text); }
    .text-muted { color: var(--muted); }
    .text-soft { color: var(--soft); }
    .border-theme { border-color: var(--border); }

    .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--brand-bg); position: relative; flex-shrink: 0; }
    .brand-mark::before { content: ''; position: absolute; inset: 4px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 999px; }
    .brand-mark::after { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); left: 50%; top: 50%; transform: translate(-50%, -50%); }

    .field-input { background-color: var(--input); border: 1px solid var(--input-border); color: var(--input-text); border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; width: 100%; transition: border-color 0.15s; }
    .field-input:focus { outline: none; border-color: var(--accent); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(0.95); }
    .btn-ghost { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--hover); color: var(--text); }

    .msg-row { border-bottom: 1px solid var(--border); transition: background 0.12s; cursor: pointer; }
    .msg-row:hover { background-color: var(--hover); }
    .msg-row.unread { background-color: var(--accent-soft); }
    .msg-row.unread:hover { background-color: var(--accent-soft-hover); }

    .tab-btn { padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600; margin-bottom: -1px; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; color: var(--muted); }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-color: var(--accent); }

    .empty-wrap { padding: 40px 20px; text-align: center; }
    .empty-icon { color: var(--soft); margin: 0 auto 12px; display: block; }
    .empty-title { color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .empty-sub { color: var(--soft); font-size: 12px; }

    #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex; align-items: center; justify-content: center; }
    #modal-backdrop.hidden { display: none; }
    #modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; width: 100%; max-width: 540px; box-shadow: 0 8px 40px rgba(0,0,0,0.35); }

    #compose-panel { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 8px 40px rgba(0,0,0,0.35); z-index: 40; }
    #compose-panel.hidden { display: none; }

    #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--success); color: #fff; padding: 0.55rem 1.2rem; border-radius: 0.5rem; font-size: 0.82rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.error { background: var(--danger); }
    #toast.show { opacity: 1; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--soft); border-radius: 4px; }

    .mobile-header {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: var(--sidebar); border-bottom: 1px solid var(--border);
      align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 50;
    }
    .mobile-hamburger {
      display: flex; flex-direction: column; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 8px; margin: -8px;
    }
    .mobile-hamburger span { display: block; width: 20px; height: 2px; background: var(--muted); border-radius: 2px; }
    .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 15; display: none; }
    @media (max-width: 767px) {
      .mobile-header { display: flex; }
      .sidebar { transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); z-index: 20; }
      .sidebar.open { transform: translateX(0); }
      #inbox-main { margin-left: 0 !important; padding: 64px 12px 24px !important; }
      #compose-panel { left: 0; right: 0; bottom: 0; width: auto; border-radius: 1rem 1rem 0 0; }
      #modal-box { margin: 12px; max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body class="min-h-screen font-sans flex">

  <div id="nav-overlay" class="nav-overlay" onclick="closeMobileNav()"></div>
  <header class="mobile-header">
    <button class="mobile-hamburger" onclick="toggleMobileNav()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <a href="/" class="text-sm font-bold tracking-tight text-main no-underline">Look<strong>At</strong><span style="color:var(--accent);">Me</span></a>
    <div class="w-9"></div>
  </header>

  <aside class="sidebar fixed top-0 left-0 h-full w-56 flex flex-col z-10 select-none">
    <div class="px-5 py-5 border-b border-theme">
      <a href="/" class="flex items-center gap-2.5 no-underline">
        <span class="brand-mark"></span>
        <span class="text-main font-bold text-base tracking-tight">Look<strong>At</strong><span style="color:var(--accent);">Me</span></span>
      </a>
      <p id="sidebar-date" class="text-soft text-xs mt-2"></p>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      <a href="/profile" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 21a8 8 0 00-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        {{ _('Profile') }}
      </a>
      <a href="/" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        {{ _('Dashboard') }}
      </a>
      <a href="/focus" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        {{ _('Focus') }}
      </a>
      <a href="/activity-feed" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        {{ _('Activity Feed') }}
      </a>
      <a href="/invitations" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        {{ _('Friends') }}
      </a>
      <a href="/inbox" class="nav-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <span class="relative flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span id="inbox-badge" class="hidden absolute -top-1.5 -right-1.5 w-3.5 h-3.5 rounded-full text-white text-[8px] font-bold flex items-center justify-center leading-none" style="background:var(--accent);"></span>
        </span>
        {{ _('Messages') }}
      </a>
      <a href="/#notes-section" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6M7 4h10a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
        {{ _('Notes') }}
      </a>
    </nav>

    <div class="px-5 py-4 border-t border-theme space-y-3">
      <div class="font-mono text-xl font-bold text-main tabular-nums" id="sidebar-clock"></div>
      <p id="sidebar-user" class="text-soft text-xs truncate"></p>
      <button onclick="logout()" class="btn-ghost w-full text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer">{{ _('Sign out') }}</button>
    </div>
  </aside>

  <main id="inbox-main" class="ml-56 flex-1 p-8 min-h-screen overflow-y-auto">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-main">{{ _('Inbox') }}</h1>
          <p class="text-muted text-sm mt-1">{{ _('Your messages') }}</p>
        </div>
        <button onclick="openCompose()" class="btn-primary flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          {{ _('Compose') }}
        </button>
      </div>

      <div class="flex gap-1 mb-4 border-b border-theme">
        <button id="tab-inbox" onclick="switchTab('inbox')" class="tab-btn active cursor-pointer">{{ _('Inbox') }}</button>
        <button id="tab-sent" onclick="switchTab('sent')" class="tab-btn cursor-pointer">{{ _('Sent') }}</button>
      </div>

      <div class="card">
        <div id="msg-list" class="min-h-[200px]">
          <div class="px-5 py-8 text-center text-soft text-sm">Loading…</div>
        </div>
      </div>
    </div>
  </main>

  <div id="modal-backdrop" class="hidden" onclick="closeModal(event)">
    <div id="modal-box" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 py-4 border-b border-theme">
        <h2 id="modal-subject" class="text-main font-semibold text-base"></h2>
        <button onclick="closeModal()" class="text-muted hover:text-main transition-colors cursor-pointer text-lg leading-none">✕</button>
      </div>
      <div class="px-5 py-4 border-b border-theme">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-muted text-xs"><span class="text-soft">From:</span> <span id="modal-from"></span></p>
            <p class="text-muted text-xs mt-0.5"><span class="text-soft">To:</span> <span id="modal-to"></span></p>
          </div>
          <p id="modal-date" class="text-soft text-xs"></p>
        </div>
      </div>
      <div class="px-5 py-5">
        <p id="modal-content" class="text-sm leading-relaxed whitespace-pre-wrap" style="color:var(--input-text);"></p>
      </div>
      <div class="px-5 pb-5 flex justify-end">
        <button onclick="closeModal()" class="btn-ghost px-4 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer">Close</button>
      </div>
    </div>
  </div>

  <div id="compose-panel" class="hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-theme">
      <p class="text-main text-sm font-semibold">New Message</p>
      <button onclick="closeCompose()" class="text-muted hover:text-main cursor-pointer leading-none">✕</button>
    </div>
    <div class="px-4 py-4 space-y-3">
      <div>
        <label class="text-soft text-xs font-semibold uppercase tracking-wide block mb-1">To</label>
        <select id="compose-to" class="field-input">
          <option value="">Select recipient…</option>
        </select>
      </div>
      <div>
        <label class="text-soft text-xs font-semibold uppercase tracking-wide block mb-1">Subject</label>
        <input id="compose-subject" type="text" placeholder="Subject" class="field-input" />
      </div>
      <div>
        <label class="text-soft text-xs font-semibold uppercase tracking-wide block mb-1">Message</label>
        <textarea id="compose-body" rows="5" placeholder="Write your message…" class="field-input" style="resize:vertical;"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeCompose()" class="btn-ghost px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors">Cancel</button>
        <button onclick="sendMessage()" class="btn-primary px-4 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors">Send</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let currentTab = 'inbox';
    let allUsers = [];
    let meId = null;

    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      return sameDay
        ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function userName(id) {
      const u = allUsers.find(u => u.id === id);
      return u ? (u.display_name || u.email) : `User #${id}`;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = isError ? 'error show' : 'show';
      setTimeout(() => { t.className = isError ? 'error' : ''; }, 2500);
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
      window.location.href = '/login';
    }

    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.status === 401) { window.location.href = '/login'; return; }
        const user = await res.json();
        meId = user.id;
        document.getElementById('sidebar-user').textContent = user.email;
      } catch {}
    })();

    function tick() {
      const now = new Date();
      const cl = document.getElementById('sidebar-clock');
      if (cl) cl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sd = document.getElementById('sidebar-date');
      if (sd && !sd.textContent) sd.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    tick(); setInterval(tick, 1000);

    async function pollUnread() {
      try {
        const { count } = await fetch('/api/messages/unread-count').then(r => r.json());
        const badge = document.getElementById('inbox-badge');
        if (count > 0) {
          badge.textContent = count > 9 ? '9+' : count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      } catch {}
    }
    pollUnread(); setInterval(pollUnread, 30_000);

    async function loadUsers() {
      try {
        allUsers = await fetch('/api/messages/users').then(r => r.json());
        const selfRes = await fetch('/api/auth/me');
        if (selfRes.ok) {
          const me = await selfRes.json();
          if (!allUsers.find(u => u.id === me.id)) {
            allUsers.push({ id: me.id, email: me.email, display_name: me.display_name || '' });
          }
        }
        const sel = document.getElementById('compose-to');
        sel.innerHTML = '<option value="">Select recipient…</option>';
        allUsers.filter(u => u.id !== meId).forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = u.display_name ? `${u.display_name} (${u.email})` : u.email;
          sel.appendChild(opt);
        });
      } catch {}
    }
    loadUsers();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-inbox').classList.toggle('active', tab === 'inbox');
      document.getElementById('tab-sent').classList.toggle('active', tab === 'sent');
      loadMessages();
    }

    function emptyState(type) {
      const isInbox = type === 'inbox';
      return `<div class="empty-wrap">
        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="empty-icon" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          ${isInbox ? '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>' : '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>'}
        </svg>
        <p class="empty-title">${isInbox ? 'Your inbox is empty' : 'Nothing sent yet'}</p>
        <p class="empty-sub">${isInbox ? 'Messages from teammates will appear here.' : 'Start a conversation with someone on the team.'}</p>
      </div>`;
    }

    async function loadMessages() {
      const list = document.getElementById('msg-list');
      list.innerHTML = '<div class="px-5 py-8 text-center text-soft text-sm">Loading…</div>';
      try {
        const url = currentTab === 'inbox' ? '/api/messages/inbox' : '/api/messages/sent';
        const msgs = await fetch(url).then(r => r.json());
        if (!msgs.length) {
          list.innerHTML = emptyState(currentTab);
          return;
        }
        list.innerHTML = msgs.map(m => renderRow(m)).join('');
      } catch {
        list.innerHTML = '<div class="px-5 py-8 text-center text-soft text-sm">Error loading messages.</div>';
      }
    }

    function renderRow(m) {
      const isInbox = currentTab === 'inbox';
      const unread = isInbox && !m.read;
      const counterparty = isInbox ? userName(m.sender_id) : userName(m.recipient_id);
      const label = isInbox ? '' : `<span class="text-soft text-xs">To:</span> `;
      const preview = m.content.length > 80 ? m.content.slice(0, 80) + '…' : m.content;

      return `
        <div class="msg-row px-5 py-3.5 ${unread ? 'unread' : ''}" onclick="openMessage(${m.id})">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-2 min-w-0">
              ${unread ? '<span class="flex-shrink-0 w-2 h-2 rounded-full mt-1" style="background:var(--accent);"></span>' : '<span class="flex-shrink-0 w-2 h-2 mt-1"></span>'}
              <div class="min-w-0">
                <div class="flex items-baseline gap-2">
                  <span class="text-sm ${unread ? 'font-bold' : 'font-medium'} text-main truncate">${label}${esc(counterparty)}</span>
                  <span class="flex-shrink-0 text-xs text-soft">${fmtDate(m.created_at)}</span>
                </div>
                <p class="text-sm ${unread ? 'font-medium text-main' : 'text-muted'} truncate">${esc(m.subject)}</p>
                <p class="text-xs text-soft truncate mt-0.5">${esc(preview)}</p>
              </div>
            </div>
          </div>
        </div>`;
    }
    loadMessages();

    let openMsgData = null;

    async function openMessage(id) {
      const url = currentTab === 'inbox' ? '/api/messages/inbox' : '/api/messages/sent';
      let msgs;
      try { msgs = await fetch(url).then(r => r.json()); } catch { return; }
      const m = msgs.find(x => x.id === id);
      if (!m) return;
      openMsgData = m;

      document.getElementById('modal-subject').textContent = m.subject;
      document.getElementById('modal-from').textContent    = userName(m.sender_id);
      document.getElementById('modal-to').textContent      = userName(m.recipient_id);
      document.getElementById('modal-date').textContent    = new Date(m.created_at).toLocaleString();
      document.getElementById('modal-content').textContent = m.content;
      document.getElementById('modal-backdrop').classList.remove('hidden');

      if (currentTab === 'inbox' && !m.read) {
        try {
          await fetch(`/api/messages/${id}/read`, { method: 'PATCH' });
          loadMessages();
          pollUnread();
        } catch {}
      }
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal-backdrop')) return;
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openCompose() {
      document.getElementById('compose-panel').classList.remove('hidden');
      document.getElementById('compose-subject').focus();
    }

    function closeCompose() {
      document.getElementById('compose-panel').classList.add('hidden');
      document.getElementById('compose-to').value = '';
      document.getElementById('compose-subject').value = '';
      document.getElementById('compose-body').value = '';
    }

    async function sendMessage() {
      const recipient_id = parseInt(document.getElementById('compose-to').value);
      const subject = document.getElementById('compose-subject').value.trim();
      const content = document.getElementById('compose-body').value.trim();

      if (!recipient_id || !subject || !content) {
        showToast('Please fill in all fields', true);
        return;
      }

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient_id, subject, content }),
        });
        if (!res.ok) {
          const err = await res.json();
          showToast(err.error || 'Failed to send', true);
          return;
        }
        showToast('Message sent');
        closeCompose();
        if (currentTab === 'sent') loadMessages();
      } catch {
        showToast('Failed to send', true);
      }
    }

    function toggleMobileNav() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('nav-overlay');
      const isOpen  = sidebar.classList.toggle('open');
      overlay.style.display = isOpen ? 'block' : 'none';
    }
    function closeMobileNav() {
      document.querySelector('.sidebar').classList.remove('open');
      document.getElementById('nav-overlay').style.display = 'none';
    }

    (function () {
      const socket = io({ transports: ['websocket', 'polling'] });
      socket.on('new_message', () => {
        pollUnread();
        if (currentTab === 'inbox') loadMessages();
      });
    })();
  </script>
</body>
</html>
