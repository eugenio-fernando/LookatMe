{% extends "base.html" %}
{% block document %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);window.__savedTheme=t;})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friend Profile — LookAtMe</title>
  <style>
    html[data-theme="dark"]  { --bg:#161616; --card:#1e1e1e; --border:#2a2a2a; --text:#fff; --muted:#9ca3af; --accent:#a3e635; }
    html[data-theme="light"] { --bg:#f5f5f7; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --accent:#2563eb; }
    html[data-theme="sepia"] { --bg:#f4ecd8; --card:#fbf6e7; --border:#d4c3a8; --text:#3c2a1a; --muted:#8a7060; --accent:#b45309; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:760px; margin:0 auto; padding:32px 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/" style="color:var(--accent);text-decoration:none;">← Back to dashboard</a></p>
    <section class="card">
      <div id="loading" class="muted">Loading friend profile…</div>
      <div id="content" style="display:none;">
        <div style="display:flex;gap:14px;align-items:center;">
          <img id="avatar" src="" alt="avatar" style="width:72px;height:72px;border-radius:999px;object-fit:cover;border:1px solid var(--border);" />
          <div>
            <h1 id="name" style="margin:0 0 4px;font-size:24px;"></h1>
            <p id="nickname" class="muted" style="margin:0;"></p>
          </div>
        </div>
        <p id="bio" class="muted" style="margin-top:16px;"></p>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;">
          <div class="card" style="padding:12px;"><div class="muted" style="font-size:12px;">Current streak</div><div id="streak" style="font-size:20px;font-weight:700;"></div></div>
          <div class="card" style="padding:12px;"><div class="muted" style="font-size:12px;">Best streak</div><div id="best" style="font-size:20px;font-weight:700;"></div></div>
        </div>
        <p id="instagram" style="margin-top:14px;"></p>
        <p id="linkedin" style="margin-top:8px;"></p>
      </div>
    </section>
  </div>

  <script>
    function defaultAvatar(){
      return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='40' fill='%23262626'/%3E%3Ccircle cx='40' cy='30' r='14' fill='%23444'/%3E%3Cellipse cx='40' cy='68' rx='22' ry='16' fill='%23444'/%3E%3C/svg%3E";
    }

    (async function(){
      const friendId = {{ friend_id|tojson }};
      try {
        const res = await fetch(`/api/friends/${friendId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load profile');
        document.getElementById('avatar').src = data.avatar_url || defaultAvatar();
        document.getElementById('name').textContent = data.display_name || 'Friend';
        document.getElementById('nickname').textContent = data.nickname ? `Nickname: ${data.nickname}` : '';
        document.getElementById('bio').textContent = data.bio || 'No bio yet.';
        document.getElementById('streak').textContent = `${data.current_streak || 0} days`;
        document.getElementById('best').textContent = `${data.longest_streak || 0} days`;
        const ig = data.instagram_username ? `https://instagram.com/${data.instagram_username.replace('@','')}` : '';
        document.getElementById('instagram').innerHTML = ig ? `<a href="${ig}" target="_blank" rel="noopener" style="color:var(--accent);">Instagram</a>` : '';
        document.getElementById('linkedin').innerHTML = data.linkedin_url ? `<a href="${data.linkedin_url}" target="_blank" rel="noopener" style="color:var(--accent);">LinkedIn</a>` : '';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').textContent = 'Could not load friend profile.';
      }
    })();
  </script>
</body>
</html>
{% endblock %}
