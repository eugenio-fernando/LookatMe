<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>LookAtMe — Invitations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#1e1e1e',
              card:    '#262626',
              hover:   '#2e2e2e',
              border:  '#333333',
              input:   '#1a1a1a',
            },
          },
        },
      },
    }
  </script>
  <style>
    html[data-theme="dark"]  { --bg:#161616; --sidebar:#111111; --card:#1e1e1e; --hover:#1e1e1e; --border:#2a2a2a; --text:#ffffff; --muted:#8a8a8a; --soft:#71717a; --accent:#a3e635; }
    html[data-theme="light"] { --bg:#f5f5f7; --sidebar:#ffffff; --card:#ffffff; --hover:#f3f4f6; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --soft:#6b7280; --accent:#2563eb; }
    html[data-theme="sepia"] { --bg:#f4ecd8; --sidebar:#ede4cf; --card:#fbf6e7; --hover:#f0e8d4; --border:#d4c3a8; --text:#3c2a1a; --muted:#7c6350; --soft:#8a7060; --accent:#b45309; }
    body { background-color: var(--bg); color: var(--text); transition: background-color .2s, color .2s; }
    .sidebar { background-color: var(--sidebar); border-right: 1px solid var(--border); }
    .nav-link { color: var(--muted); transition: background 0.15s, color 0.15s; }
    .nav-link:hover { background-color: var(--hover); color: var(--text); }
    .nav-link.active { background-color: var(--hover); color: var(--text); border-left: 2px solid var(--accent); }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.22), 0 1px 4px rgba(0,0,0,0.15);
    }
    .pill {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    }
    .pill-pending  { background: rgba(113,113,122,0.18); color: #a1a1aa; }
    .pill-opened   { background: rgba(59,130,246,0.15);  color: #60a5fa; }
    .pill-accepted { background: rgba(163,230,53,0.15);  color: #a3e635; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .mobile-header {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: var(--sidebar); border-bottom: 1px solid var(--border);
      align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 50;
    }
    .mobile-hamburger {
      display: flex; flex-direction: column; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 8px;
      width: 36px; height: 36px; flex-shrink: 0;
    }
    .mobile-hamburger span { display: block; width: 20px; height: 2px; background: var(--muted); border-radius: 2px; }
    .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 35; display: none; }
    @media (max-width: 767px) {
      .mobile-header { display: flex; }
      aside {
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
        z-index: 40;
      }
      aside.open { transform: translateX(0); }
      main { margin-left: 0 !important; padding: 68px 16px 32px !important; }
    }
  </style>
</head>
<body class="min-h-screen font-sans flex">

  <div id="nav-overlay" class="nav-overlay" onclick="closeMobileNav()"></div>
  <header class="mobile-header">
    <button class="mobile-hamburger" onclick="toggleMobileNav()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <a href="/" style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.01em;text-decoration:none;">Look<strong>At</strong><span style="color:var(--accent);">Me</span></a>
    <div style="width:36px;"></div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="sidebar fixed top-0 left-0 h-full w-56 flex flex-col z-10 select-none">
    <div class="px-5 py-5 border-b border-[#2a2a2a]">
      <a href="/" class="flex items-center gap-2.5" style="text-decoration:none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" style="flex-shrink:0;">
          <rect width="28" height="28" rx="7" fill="#1a1a1a"/>
          <circle cx="14" cy="14" r="11" fill="none" stroke="#a3e635" stroke-width="1.5" opacity="0.3"/>
          <circle cx="14" cy="14" r="7" fill="none" stroke="#a3e635" stroke-width="0.75" opacity="0.18"/>
          <circle cx="14" cy="14" r="4" fill="#a3e635"/>
        </svg>
        <span style="color:var(--text);font-weight:700;font-size:16px;letter-spacing:-0.01em;">Look<strong>At</strong><span style="color:var(--accent);">Me</span></span>
      </a>
      <p id="sidebar-date" class="text-[#5a5a5a] text-xs mt-2"></p>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      <a href="/" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/focus" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Focus Mode
      </a>
      <a href="/learning" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        Learning
      </a>
      <a href="/invitations" class="nav-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Invitations
      </a>
    </nav>

    <div class="px-5 py-4 border-t border-[#2a2a2a] space-y-3">
      <div class="font-mono text-xl font-bold text-white tabular-nums" id="sidebar-clock"></div>
      <button onclick="logout()" class="w-full text-left text-xs text-[#5a5a5a] hover:text-white transition-colors">Sign out →</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="flex-1 ml-56 p-8 max-w-4xl">

    <div style="margin-bottom:28px;">
      <h1 style="font-size:22px;font-weight:800;color:#f4f4f5;letter-spacing:-0.02em;margin-bottom:4px;">Invitations</h1>
      <p style="font-size:13px;color:#71717a;">Track your friend invitations and see who joined.</p>
    </div>

    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;" id="stats-row">
      <div class="card" style="padding:16px 20px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#71717a;margin-bottom:6px;">Sent</p>
        <p id="stat-sent" style="font-size:26px;font-weight:800;color:#f4f4f5;line-height:1;">—</p>
      </div>
      <div class="card" style="padding:16px 20px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#71717a;margin-bottom:6px;">Opened</p>
        <p id="stat-opened" style="font-size:26px;font-weight:800;color:#60a5fa;line-height:1;">—</p>
      </div>
      <div class="card" style="padding:16px 20px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#71717a;margin-bottom:6px;">Joined</p>
        <p id="stat-joined" style="font-size:26px;font-weight:800;color:#a3e635;line-height:1;">—</p>
      </div>
    </div>

    <!-- Invitations table -->
    <div class="card" style="overflow:hidden;">
      <div style="padding:16px 20px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:700;color:#f4f4f5;">Your Invites</span>
        <button onclick="loadInvitations()" style="background:none;border:none;cursor:pointer;color:#71717a;font-size:12px;padding:4px 8px;border-radius:6px;transition:color 0.12s;" onmouseover="this.style.color='#f4f4f5'" onmouseout="this.style.color='#71717a'">↻ Refresh</button>
      </div>
      <div id="invitations-body" style="padding:0;">
        <div style="padding:32px;text-align:center;color:#71717a;font-size:13px;">Loading…</div>
      </div>
    </div>

    <!-- Friends list -->
    <div class="card" style="overflow:hidden;margin-top:20px;">
      <div style="padding:16px 20px;border-bottom:1px solid #2a2a2a;">
        <span style="font-size:13px;font-weight:700;color:#f4f4f5;">Friends</span>
      </div>
      <div id="friends-body" style="padding:0;">
        <div style="padding:32px;text-align:center;color:#71717a;font-size:13px;">Loading…</div>
      </div>
    </div>

  </main>

  <script>
    // Sidebar clock/date
    function updateClock() {
      const now = new Date();
      const cl = document.getElementById('sidebar-clock');
      const dt = document.getElementById('sidebar-date');
      if (cl) cl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (dt) dt.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    function toggleMobileNav() {
      document.querySelector('aside').classList.toggle('open');
      document.getElementById('nav-overlay').style.display =
        document.querySelector('aside').classList.contains('open') ? 'block' : 'none';
    }
    function closeMobileNav() {
      document.querySelector('aside').classList.remove('open');
      document.getElementById('nav-overlay').style.display = 'none';
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }); }
      catch { return iso.slice(0, 10); }
    }

    function statusPill(inv) {
      if (inv.accepted_at) return '<span class="pill pill-accepted">Joined</span>';
      if (inv.opened_at)   return '<span class="pill pill-opened">Opened</span>';
      return '<span class="pill pill-pending">Sent</span>';
    }

    const METHOD_LABELS = {
      copy: 'Link copy', whatsapp: 'WhatsApp', facebook: 'Facebook',
      twitter: 'X / Twitter', instagram: 'Instagram', email: 'Email',
    };

    async function loadInvitations() {
      const body = document.getElementById('invitations-body');
      try {
        const res  = await fetch('/api/invitations');
        if (!res.ok) throw new Error('failed');
        const list = await res.json();

        // Update stats
        document.getElementById('stat-sent').textContent   = list.length;
        document.getElementById('stat-opened').textContent = list.filter(i => i.opened_at).length;
        document.getElementById('stat-joined').textContent = list.filter(i => i.accepted_at).length;

        if (!list.length) {
          body.innerHTML = '<div style="padding:32px;text-align:center;color:#71717a;font-size:13px;">No invitations sent yet. Share your link from the dashboard!</div>';
          return;
        }

        const rows = list.map(inv => {
          const emailCell = inv.invitee_email
            ? `<p style="font-size:12px;font-weight:600;color:#f4f4f5;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${inv.invitee_email}</p>`
            : `<p style="font-size:12px;color:#52525b;">—</p>`;
          const viewedCell = inv.opened_at
            ? `<p style="font-size:11.5px;color:#60a5fa;">${fmtDate(inv.opened_at)}</p>`
            : `<p style="font-size:11.5px;color:#52525b;">—</p>`;
          const joinedCell = inv.accepted_at
            ? `<p style="font-size:11.5px;color:#a3e635;">${fmtDate(inv.accepted_at)}</p>`
            : `<p style="font-size:11.5px;color:#52525b;">—</p>`;
          return `
            <div style="display:grid;grid-template-columns:1fr 130px 90px 90px 80px;gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid #222;">
              <div style="min-width:0;">
                ${emailCell}
                <p style="font-size:10.5px;color:#71717a;">${METHOD_LABELS[inv.method] || inv.method} · ${fmtDate(inv.created_at)}</p>
              </div>
              <div style="font-size:11.5px;color:#a1a1aa;">${METHOD_LABELS[inv.method] || inv.method}</div>
              ${viewedCell}
              ${joinedCell}
              <div>${statusPill(inv)}</div>
            </div>`;
        }).join('');

        body.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 130px 90px 90px 80px;gap:10px;padding:8px 20px;border-bottom:1px solid #2a2a2a;">
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#52525b;">Email</p>
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#52525b;">Method</p>
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#52525b;">Viewed</p>
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#52525b;">Joined</p>
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#52525b;">Status</p>
          </div>
          ${rows}`;
      } catch {
        body.innerHTML = '<div style="padding:32px;text-align:center;color:#f87171;font-size:13px;">Could not load invitations.</div>';
      }
    }

    async function loadFriends() {
      const body = document.getElementById('friends-body');
      try {
        const res  = await fetch('/api/friends');
        if (!res.ok) throw new Error('failed');
        const list = await res.json();

        if (!list.length) {
          body.innerHTML = '<div style="padding:32px;text-align:center;color:#71717a;font-size:13px;">No friends yet — invite someone from the dashboard!</div>';
          return;
        }

        body.innerHTML = list.map(f => `
          <div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #222;">
            <div style="width:36px;height:36px;border-radius:50%;background:#262626;border:1px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700;color:#a3e635;">
              ${(f.name || '?').charAt(0).toUpperCase()}
            </div>
            <div style="flex:1;min-width:0;">
              <p style="font-size:13px;font-weight:600;color:#f4f4f5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</p>
              <p style="font-size:11px;color:#71717a;">Friends since ${fmtDate(f.friends_since)}</p>
            </div>
            ${f.streak > 0 ? `<span style="font-size:13px;font-weight:700;color:#fb923c;">${f.streak} 🔥</span>` : ''}
          </div>`).join('');
      } catch {
        body.innerHTML = '<div style="padding:32px;text-align:center;color:#f87171;font-size:13px;">Could not load friends.</div>';
      }
    }

    loadInvitations();
    loadFriends();
  </script>
</body>
</html>
