{% extends "base.html" %}
{% block document %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);window.__savedTheme=t;})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <title>Learning — LookAtMe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html[data-theme="dark"]  { --bg:#161616; --panel:#111111; --card:#1e1e1e; --card-hover:#252525; --border:#2a2a2a; --text:#ffffff; --muted:#8a8a8a; --soft:#6b7280; --input:#1a1a1a; --input-border:#333; --input-text:#e5e7eb; --accent:#a3e635; --accent-strong:#65a30d; --danger:#dc2626; --danger-hover:#b91c1c; }
    html[data-theme="light"] { --bg:#f5f5f7; --panel:#ffffff; --card:#ffffff; --card-hover:#f3f4f6; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --soft:#6b7280; --input:#f9fafb; --input-border:#d1d5db; --input-text:#111827; --accent:#2563eb; --accent-strong:#1d4ed8; --danger:#dc2626; --danger-hover:#b91c1c; }
    html[data-theme="sepia"] { --bg:#f4ecd8; --panel:#ede4cf; --card:#fbf6e7; --card-hover:#f0e8d4; --border:#d4c3a8; --text:#3c2a1a; --muted:#7c6350; --soft:#8a7060; --input:#f0e8d4; --input-border:#c8b697; --input-text:#3c2a1a; --accent:#b45309; --accent-strong:#92400e; --danger:#b91c1c; --danger-hover:#991b1b; }

    body { background-color: var(--bg); color: var(--text); transition: background-color .2s, color .2s; }
    .top-panel { background: var(--panel); border-bottom: 1px solid var(--border); }
    .top-label { color: var(--soft); }
    .nav-link { color: var(--muted); transition: color 0.15s; }
    .nav-link:hover { color: var(--text); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.22); }
    .section-title { color: var(--soft); }
    .field-input {
      width: 100%; background: var(--input); color: var(--input-text); border: 1px solid var(--input-border);
      border-radius: 0.75rem; padding: 0.75rem 1rem; font-size: 0.875rem; transition: border-color 0.15s;
    }
    .field-input::placeholder { color: var(--muted); }
    .field-input:focus { outline: none; border-color: var(--accent); }
    .field-label { color: var(--soft); }

    .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; border-radius: 0.5rem; transition: background 0.15s, transform 0.1s, opacity 0.1s; }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary { background-color: var(--accent); color: #fff; padding: 0.625rem 1.25rem; font-size: 0.875rem; }
    .btn-primary:hover { background-color: var(--accent-strong); }
    .btn-secondary { background-color: var(--panel); color: var(--muted); border: 1px solid var(--border); padding: 0.375rem 0.875rem; font-size: 0.75rem; }
    .btn-secondary:hover { background-color: var(--card-hover); color: var(--text); }
    .btn-danger { background-color: var(--danger); color: #fee2e2; padding: 0.25rem 0.75rem; font-size: 0.7rem; }
    .btn-danger:hover { background-color: var(--danger-hover); color: #fff; }

    .muted { color: var(--muted); }
    .soft { color: var(--soft); }
    .item-card { background: var(--card); border: 1px solid var(--border); }
    .progress-track { background: var(--input); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 4px; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
            mono: ['SF Mono', 'Fira Code', 'Consolas', 'monospace'],
          },
        },
      },
    }
  </script>
</head>
<body class="min-h-screen font-sans flex flex-col">

  <div class="top-panel flex items-center justify-between px-4 sm:px-8 pt-5 pb-4 gap-2 flex-wrap">
    <span class="top-label text-xs font-semibold uppercase tracking-widest">Learning Tracker</span>
    <div class="flex items-center gap-4 flex-wrap justify-end">
      <a href="/focus" class="nav-link text-xs transition-colors">Focus</a>
      <a href="/" class="nav-link text-xs transition-colors">Full Dashboard &rarr;</a>
    </div>
  </div>

  <main class="flex-1 flex flex-col items-center px-4 sm:px-6 pb-12 gap-8 max-w-2xl mx-auto w-full">

    <section class="card w-full p-6">
      <h2 class="section-title text-xs font-semibold uppercase tracking-widest mb-5">Add Item</h2>
      <div class="space-y-3">
        <input id="new-title" type="text" placeholder="Title (e.g. AWS Cloud Practitioner)" class="field-input" />
        <div class="grid grid-cols-2 gap-3">
          <select id="new-category" class="field-input">
            <option value="coding">Coding</option>
            <option value="cloud">Cloud</option>
            <option value="languages">Languages</option>
            <option value="math">Math</option>
            <option value="design">Design</option>
            <option value="business">Business</option>
            <option value="general" selected>General</option>
          </select>
          <input id="new-hours" type="number" min="0" step="0.5" placeholder="Hours studied" class="field-input" />
        </div>
        <div class="flex items-center gap-3">
          <label class="field-label text-xs flex-shrink-0 w-24">Progress: <span id="new-progress-val">0</span>%</label>
          <input id="new-progress" type="range" min="0" max="100" value="0" oninput="document.getElementById('new-progress-val').textContent = this.value" class="flex-1" />
        </div>
        <textarea id="new-notes" rows="2" placeholder="Notes (optional)" class="field-input resize-none"></textarea>
        <button onclick="addItem()" class="btn btn-primary w-full rounded-xl">Add to Tracker</button>
      </div>
    </section>

    <section class="w-full">
      <p class="section-title text-xs font-semibold uppercase tracking-widest mb-4">Your Items</p>
      <div id="items-list" class="space-y-3">
        <p class="muted text-sm">Loading…</p>
      </div>
    </section>

  </main>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const CATEGORY_COLORS = {
      coding:    'text-blue-500',
      cloud:     'text-cyan-500',
      languages: 'text-green-500',
      math:      'text-amber-500',
      design:    'text-pink-500',
      business:  'text-orange-500',
      general:   'soft',
    };

    function progressColor(pct) {
      if (pct >= 80) return 'from-green-700 to-green-400';
      if (pct >= 40) return 'from-blue-700 to-blue-400';
      return 'from-zinc-700 to-zinc-500';
    }

    function renderItems(items) {
      const container = document.getElementById('items-list');
      if (!items.length) {
        container.innerHTML = `<div class="flex flex-col items-center gap-3 py-10 text-center">
          <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="soft" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          <div>
            <p class="text-sm font-medium mb-1" style="color:var(--text);">Track something you're learning today</p>
            <p class="soft text-xs">Add a book, course, or skill above and track your progress.</p>
          </div>
        </div>`;
        return;
      }
      container.innerHTML = items.map(item => {
        const catCls = CATEGORY_COLORS[item.category] || CATEGORY_COLORS.general;
        const gradCls = progressColor(item.progress);
        return `
          <div class="item-card rounded-2xl px-5 py-4" id="item-${item.id}">
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex-1 min-w-0">
                <p class="font-medium text-base leading-snug" style="color:var(--text);">${escapeHtml(item.title)}</p>
                <div class="flex items-center gap-3 mt-0.5">
                  <span class="${catCls} text-xs font-medium capitalize">${escapeHtml(item.category)}</span>
                  <span class="soft text-xs">${item.hours_studied}h studied</span>
                </div>
              </div>
              <button onclick="deleteItem(${item.id})" class="btn btn-danger flex-shrink-0">Remove</button>
            </div>

            <div class="flex items-center gap-3 mb-3">
              <div class="progress-track flex-1 rounded-full h-2 overflow-hidden">
                <div class="h-2 rounded-full bg-gradient-to-r ${gradCls} transition-all duration-500" style="width: ${item.progress}%"></div>
              </div>
              <span class="soft text-xs font-mono w-8 text-right">${item.progress}%</span>
            </div>

            ${item.notes ? `<p class="soft text-xs italic mb-3">${escapeHtml(item.notes)}</p>` : ''}

            <details class="group">
              <summary class="btn btn-secondary cursor-pointer list-none inline-flex">Update progress</summary>
              <div class="mt-3 space-y-2">
                <div class="flex items-center gap-3">
                  <label class="field-label text-xs w-24 flex-shrink-0">Progress: <span id="upd-val-${item.id}">${item.progress}</span>%</label>
                  <input id="upd-prog-${item.id}" type="range" min="0" max="100" value="${item.progress}" oninput="document.getElementById('upd-val-${item.id}').textContent = this.value" class="flex-1" />
                </div>
                <div class="flex items-center gap-3">
                  <label class="field-label text-xs w-24 flex-shrink-0">Hours</label>
                  <input id="upd-hours-${item.id}" type="number" min="0" step="0.5" value="${item.hours_studied}" class="field-input text-xs py-2" />
                </div>
                <div class="flex items-center gap-3">
                  <label class="field-label text-xs w-24 flex-shrink-0">Notes</label>
                  <input id="upd-notes-${item.id}" type="text" value="${escapeHtml(item.notes)}" class="field-input text-xs py-2" />
                </div>
                <button onclick="saveUpdate(${item.id})" class="btn btn-primary">Save changes</button>
              </div>
            </details>
          </div>
        `;
      }).join('');
    }

    async function loadItems() {
      const data = await fetch('/api/learning').then(r => r.json()).catch(() => []);
      renderItems(data);
    }
    loadItems();

    async function addItem() {
      const title = document.getElementById('new-title').value.trim();
      if (!title) {
        document.getElementById('new-title').focus();
        return;
      }
      const body = {
        title,
        category:      document.getElementById('new-category').value,
        progress:      parseInt(document.getElementById('new-progress').value),
        hours_studied: parseFloat(document.getElementById('new-hours').value || '0'),
        notes:         document.getElementById('new-notes').value.trim(),
      };
      const res = await fetch('/api/learning', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        document.getElementById('new-title').value   = '';
        document.getElementById('new-hours').value   = '';
        document.getElementById('new-notes').value   = '';
        document.getElementById('new-progress').value = 0;
        document.getElementById('new-progress-val').textContent = 0;
        loadItems();
      }
    }

    async function saveUpdate(id) {
      const body = {
        progress:      parseInt(document.getElementById(`upd-prog-${id}`).value),
        hours_studied: parseFloat(document.getElementById(`upd-hours-${id}`).value || '0'),
        notes:         document.getElementById(`upd-notes-${id}`).value.trim(),
      };
      const res = await fetch(`/api/learning/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) loadItems();
    }

    async function deleteItem(id) {
      const res = await fetch(`/api/learning/${id}`, { method: 'DELETE' });
      if (res.ok) {
        const el = document.getElementById(`item-${id}`);
        if (el) el.remove();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.activeElement.id === 'new-title') addItem();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
{% endblock %}
